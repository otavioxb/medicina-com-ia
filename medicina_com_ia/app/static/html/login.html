<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Medicina com IA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/theme.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #0ea5e9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 2.5rem 2rem;
    }
    .login-card .brand-icon {
      width: 64px;
      height: 64px;
      font-size: 1.8rem;
    }
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    .login-bg-shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .login-bg-shapes div {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .login-bg-shapes .s1 { width: 300px; height: 300px; top: -80px; right: -60px; }
    .login-bg-shapes .s2 { width: 200px; height: 200px; bottom: -50px; left: -40px; }
    .login-bg-shapes .s3 { width: 150px; height: 150px; top: 40%; left: 10%; }
  </style>
</head>
<body>
  <div class="login-bg-shapes">
    <div class="s1"></div>
    <div class="s2"></div>
    <div class="s3"></div>
  </div>

  <div class="login-wrapper fade-in-up" style="position:relative;z-index:1;">
    <div class="login-card">
      <div class="brand-icon">
        <i class="bi bi-heart-pulse"></i>
      </div>
      <div class="brand-title">Medicina com IA</div>
      <div class="brand-subtitle">Acesse sua conta para continuar</div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">
            <i class="bi bi-envelope me-1"></i>E-mail
          </label>
          <input type="email" class="form-control" id="email" placeholder="seu@email.com" required />
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">
            <i class="bi bi-lock me-1"></i>Senha
          </label>
          <div class="input-group">
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required />
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()" style="border-color:var(--border);">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
      </form>

      <div id="loginMessage" class="alert d-none mt-3" role="alert"></div>

      <div class="login-footer">
        <span style="color:var(--text-secondary);font-size:0.9rem;">Ainda nao tem conta?</span>
        <a href="/cadastro">Criar conta</a>
      </div>
    </div>
  </div>

  <script src="/static/js/login.js?v={{ now }}"></script>
</body>
</html>
