<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - IA no Prontuário</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.8s ease-out;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #0d6efd;
    }

    .form-label {
      font-weight: bold;
    }

    .btn-primary {
      width: 100%;
      border-radius: 10px;
      padding: 10px;
    }

    .app-title {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #0d6efd;
    }

    @keyframes fadeIn {
      from {
        transform: translateY(-30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .alert {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="app-title">Login - Medicina com IA</div>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Usuário:</label>
        <input type="email" class="form-control" id="email" required />
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha:</label>
        <div class="input-group">
          <input type="password" class="form-control" id="senha" required />
          <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <div id="loginMessage" class="alert d-none" role="alert"></div>
  </div>

  <script src="/static/js/login.js?v={{ now }}"></script>
</body>
</html>
