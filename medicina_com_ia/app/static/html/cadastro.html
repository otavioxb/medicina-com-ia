<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Cadastro de Usuário </h2>
        <div id="mensagem" class="mt-3"></div>
        
        <form id="cadastroForm">
            <h4>Dados do Usuário</h4>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" maxlength="14" required>
            </div>
            <script>
            document.getElementById('cpf').addEventListener('input', function (e) {
                let value = e.target.value.replace(/\D/g, ''); // Remove tudo que não for dígito
                if (value.length > 11) value = value.slice(0, 11);
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d)/, '$1.$2');
                value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                e.target.value = value;
            });
            </script>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="senha" required>
                    <button class="btn btn-outline-secondary" type="button" id="toggleSenha">
                        👁️
                    </button>
                </div>
            </div>
            <script>
            document.getElementById('toggleSenha').addEventListener('click', function () {
                const senhaInput = document.getElementById('senha');
                if (senhaInput.type === 'password') {
                    senhaInput.type = 'text';
                } else {
                    senhaInput.type = 'password';
                }
            });
            </script>
            <div class="mb-3">
                <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="data_nascimento" required autocomplete="bday">
            </div>
            <div class="mb-3">
                <label for="profissao" class="form-label">Profissão</label>
                <select class="form-select" id="profissao" name="profissao" required>
                    <option value="" disabled selected>Selecione a profissão</option>
                    <option value="Médico">Médico</option>
                    <option value="Psicólogo">Psicólogo</option>
                    <option value="Advogado">Advogado</option>
                    <option value="Juíz">Juíz</option>
                </select>
            </div>
            <!-- <div class="mb-3">
                <label for="profissao" class="form-label">Profissão</label>
                <input type="text" class="form-control" id="profissao" required>
            </div> -->
            <div class="mb-3">
                <label for="token" class="form-label">Token de Acesso</label>
                <input type="text" class="form-control" id="token" required>
            </div>
            <!-- Cartão de Crédito permanece igual
            <h4 class="mt-4">Cartão de Crédito</h4>
            <div class="mb-3">
                <label for="nome_cartao" class="form-label">Nome no Cartão</label>
                <input type="text" class="form-control" id="nome_cartao" required>
            </div>
            <div class="mb-3">
                <label for="numero_mascarado" class="form-label">Número Mascarado</label>
                <input type="text" class="form-control" id="numero_mascarado" required>
            </div>
            <div class="mb-3">
                <label for="validade" class="form-label">Validade (MM/AA)</label>
                <input type="text" class="form-control" id="validade" required>
            </div>
            <div class="mb-3">
                <label for="bandeira" class="form-label">Bandeira</label>
                <input type="text" class="form-control" id="bandeira" required>
            </div> -->

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
        

        
    </div>

    
    <script src="/static/js/cadastro.js?v={{ now }}"></script>
</body>
</html>
