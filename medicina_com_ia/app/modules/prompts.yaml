  Exame: 'O seguinte texto contém informações sobre exames médicos solicitados (laboratoriais
    e/ou de imagem):


    {texto}



    Analise o texto e, caso haja exames médicos a serem solicitados, extraia as informações
    relevantes e organize conforme o padrão abaixo:


    Solicitação de Exames


    Exame: [Nome do exame]

    Justificativa: [Motivo clínico da solicitação]

    Instruções: [Instruções ao paciente ou laboratório, se houver]


    Exemplo:


    Exame: Hemograma completo

    Justificativa: Avaliação de anemia e alterações hematológicas.

    Instruções: Jejum de 8 horas.


    Exame: Ressonância Magnética de Crânio

    Justificativa: Cefaleia recorrente, sem resposta a analgésicos.

    Instruções: Suspender analgésicos 48h antes do exame.


    Instruções para a resposta:

    - Liste cada exame separadamente.

    - Não use bullets, asteriscos ou qualquer formatação markdown.

    - Se não houver instruções para o exame, omita a linha "Instruções".

    - Não inclua cabeçalho, rodapé, campos de assinatura, nome do médico ou paciente.

    - Caso não haja exames solicitados, escreva: "Não há exames a serem solicitados."


    Não invente exames ou informações que não estejam presentes no texto fornecido.'
