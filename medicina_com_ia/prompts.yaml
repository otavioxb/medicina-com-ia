      Classificação da Consulta

      Queixa Principal:
      O motivo que levou o paciente a buscar atendimento (ex.: dor de cabeça, tontura, fraqueza, crises convulsivas, etc.).

      História da Doença Atual (HDA):
      Quando começaram os sintomas?
      Quais foram os sintomas iniciais?
      Houve progressão ou alteração nos sintomas?

      História Médica Prévia:
      Doenças crônicas, como hipertensão, diabetes, epilepsia, doenças autoimunes, etc.
      Histórico de AVC, TCE (Traumatismo Cranioencefálico), ou outras doenças neurológicas prévias.

