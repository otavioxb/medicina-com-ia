      Uso de Medicações:
      Lista de medicações em uso pelo paciente, corrigindo os nomes, se necessário.

      História Social:
      Tabagismo, etilismo, ou uso de drogas recreativas.
      Impacto dos sintomas na vida diária, trabalho ou atividades sociais.

      Exame Físico e Neurológico:
      Alterações motoras (ex.: hemiparesia, paralisia, rigidez).
      Sensibilidade (ex.: hipoestesia, parestesia).
      Funções cognitivas (ex.: memória, linguagem).
