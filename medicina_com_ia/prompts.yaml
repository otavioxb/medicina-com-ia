    DUODENO:
    Bulbo duodenal amplo e anatômico, mucosa de aspecto normal. Segunda porção com pregueado circular e uniforme.

    CONCLUSÃO: ESÔFAGO, ESTÔMAGO E DUODENO ENDOSCOPICAMENTE NORMAIS

