    Queixa Principal:
    -	Qual a principal motivação para a consulta? (ex.: estética, funcional, trauma, sequelas de cirurgia prévia)
    -	Há alguma queixa respiratória associada? (ex.: obstrução nasal, ronco, sinusite crônica)

    História da Doença Atual (HDA):
      -	Quando começou a insatisfação estética ou a dificuldade funcional?
      -	Houve algum evento desencadeante? (ex.: trauma, cirurgia anterior, infecção)
      -	O problema piorou com o tempo ou permaneceu estável?

    História Médica e Cirúrgica Prévia:
      -	Possui histórico de cirurgias faciais anteriores? (ex.: rinoplastia, septoplastia, bichectomia)
      -	Há antecedentes de alergias respiratórias ou dermatológicas?
      -	Tem histórico de infecções crônicas nasais ou sinusais?

    História Familiar:
      -	Há casos de alterações anatômicas faciais ou problemas respiratórios familiares?

    Uso de Medicações e Hábitos:
      -	Faz uso de anticoagulantes ou outros medicamentos contínuos?
      -	Tabagismo, etilismo ou uso de substâncias que possam interferir na cicatrização?

    Exames Realizados:
      -	Já realizou exames de imagem (tomografia, ressonância) ou testes respiratórios?
      -	Alguma avaliação prévia por outro especialista?

    Exame Físico e Avaliação Clínica:
      -	Inspeção da face e estrutura nasal.
      -	Avaliação da função respiratória e simetria facial.
      -	Presença de desvios septais, hipertrofia de cornetos ou outras alterações estruturais.

    Hipótese Diagnóstica:
      -	Diagnóstico provável baseado na avaliação clínica e exames realizados.

    Conduta e Plano Terapêutico:
      -	Indicação cirúrgica e tipo de procedimento recomendado.
      -	Possíveis riscos e benefícios da cirurgia.
      -	Orientações pré e pós-operatórias.
      -	Solicitação de exames complementares (ex.: exames laboratoriais, tomografia, avaliação cardiológica se necessário).
      -	Encaminhamentos para suporte multidisciplinar (ex.: fisioterapia respiratória, dermatologia para preparo da pele, fonoaudiologia se necessário).

