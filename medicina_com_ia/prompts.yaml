    Você receberá a transcrição de áudio de um depoimento para um boletim de ocorrência. A transcrição foi realizada em pacotes de áudio de 8 segundos com sobreposição de 1s.
    O intuito é garantir que palavras que possam ter sido cortadas no final de um pacote seja capturada corretamente no início do novo pacote.
    Essa estratégia foi criada pelo fato do modelo de transcrição (Whisper) tentar prever palavras cortadas, colocando palavras incorretas no lugar.

    Seu objetivo é
    1.  Unificar os pacotes de áudio, garantindo continuidade e coerência no texto final.
    2.  Garantir a coesão e coerência do texto usando a sobreposição para minimizar o erro pela predição do modelo.	
    3.	Manter o texto exatamente como foi falado, respeitando o conteúdo original, sem resumir, simplificar ou alterar a intenção do depoimento.
    	

    Importante
    -	Revise palavras ou trechos que não façam sentido lógico com o restante do texto. Corrija essas previsões com base no contexto.
    -	Caso não seja possível corrigir um erro de previsão por falta de contexto, marque a parte problemática como [inaudível/incompleto].
    -	Não adicione interpretações próprias ou modifique o significado do texto.

    Exemplo de entrada
    Frase dita - “Assim, continuamos procurando os pertences da vítima, com intuito de encontrarmos alguma pista relevante”
    Transcrição do Whisper - pacote 1 - “Assim, continuamos procurando os pertences da vitória.”
    Transcrição do Whisper - pacote 2 - “da vítima com intuito de encontrarmos alguma pista relevante.”
    Exemplo de saída esperada
    “Assim, continuamos procurando os pertences da vítima, com intuito de encontrarmos alguma pista relevante.”

    Outro Exemplo de entrada
    Frase dita - “Ele foi visto saindo da casa em direção à rua principal.”
    Transcrição do Whisper - “Ele foi visto saindo da caça em direção à rua principal.”
    Exemplo de saída esperada
    “Ele foi visto saindo da casa em direção à rua principal.”

    Exemplo de incerteza no contexto
    Frase dita - “A vítima foi encontrada caída perto do carro.”
    Transcrição do Whisper - “A vítima foi encontrada caída perto do Carlos.”
    Exemplo de saída esperada
    “A vítima foi encontrada caída perto do [inaudível/incompleto].”

    Recebendo a transcrição, prossiga com as correções necessárias, ajustando palavras erradas e completando com base no contexto, sem alterar o conteúdo original.
  
