    Classificação da Consulta

    Queixa Principal:
      - Motivo principal da consulta.
      - Ex.: sangramento anal, dor ao evacuar, constipação, prurido, exteriorização anal, secreção perianal, alteração do hábito intestinal.

    História da Doença Atual (HDA):
      - Início dos sintomas.
      - Tempo de evolução.
      - Frequência e intensidade dos sintomas.
      - Presença de dor, sangramento, prolapso, secreção, muco, urgência evacuatória, tenesmo, constipação ou diarreia.
      - Fatores de piora ou melhora.
      - Relação com evacuação, alimentação ou esforço evacuatório.

    Hábitos Intestinais:
      - Frequência evacuatória.
      - Consistência das fezes.
      - Esforço evacuatório.
      - Sensação de evacuação incompleta.
      - Uso de laxantes, fibras ou enemas.
      - Episódios de incontinência, urgência ou escapes.

    História Médica e Cirúrgica Prévia:
      - Doenças intestinais, inflamatórias, infecciosas ou neoplásicas prévias.
      - Cirurgias anorretais ou abdominais prévias.
      - Episódios prévios semelhantes.
      - Histórico de radioterapia pélvica, traumas ou partos, se mencionado.

    História Familiar:
      - Histórico familiar de câncer colorretal, pólipos, doença inflamatória intestinal ou outras doenças intestinais relevantes.

    Uso de Medicações:
      - Medicamentos em uso contínuo.
      - Pomadas, supositórios, laxantes, fibras, antibióticos, anti-inflamatórios, imunobiológicos ou analgésicos já utilizados.
      - Corrigir os nomes, se necessário.

    Hábitos e Fatores de Risco:
      - Baixa ingestão de fibras.
      - Baixa ingesta hídrica.
      - Sedentarismo.
      - Esforço evacuatório crônico.
      - Longo tempo no vaso sanitário.
      - História de tabagismo, etilismo ou fatores associados, se mencionados.

    Exame Proctológico:
      - Inspeção da região perianal.
      - Presença de fissura, plicoma, hemorroidas, trombose, secreção, orifício fistuloso, abscesso, condilomas ou prolapso.
      - Toque retal.
      - Anuscopia, se realizada.
      - Descrever os achados do exame físico mencionados pelo médico.

    Exames Realizados ou Avaliados:
      - Colonoscopia, retossigmoidoscopia, anuscopia, ressonância, ultrassonografia endoanal, manometria, biópsias, anatomopatológico ou exames laboratoriais mencionados.
      - Incluir data e local/profissional responsável, se mencionados.

    Hipótese Diagnóstica:
      - Diagnóstico provável ou diferencial descrito pelo médico.

    Conduta:
      - Tratamento clínico prescrito.
      - Orientações dietéticas e comportamentais.
      - Uso de fibras, laxativos, pomadas ou analgésicos.
      - Solicitação de exames complementares.
      - Indicação de procedimento ambulatorial ou cirúrgico.
      - Seguimento e retorno, quando orientados.
